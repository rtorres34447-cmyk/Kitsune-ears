name: Build Kitsune Ears APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Kitsune-Ears-Android-Project.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract Android source
        shell: bash
        run: |
          set -euo pipefail
          test -f Kitsune-Ears-Android-Project.zip || { echo '::error::Upload Kitsune-Ears-Android-Project.zip to repository root'; exit 1; }
          mkdir -p "$RUNNER_TEMP/kitsune"
          unzip -q Kitsune-Ears-Android-Project.zip -d "$RUNNER_TEMP/kitsune"
          test -f "$RUNNER_TEMP/kitsune/settings.gradle" || { echo '::error::Missing settings.gradle at ZIP root'; exit 1; }
          echo "PROJECT_DIR=$RUNNER_TEMP/kitsune" >> "$GITHUB_ENV"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-Ears-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
